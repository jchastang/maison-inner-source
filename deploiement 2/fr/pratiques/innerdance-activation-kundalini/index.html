<style>

#champ{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0}

.entete{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:clamp(18px,2.6vw,30px) var(--marge) clamp(22px,3vw,34px)}

body.parti .entete::before{opacity:1}
.entete>*{position:relative}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.entete::before{background:rgba(10,16,15,.93)}}
.marque{font-family:var(--display);font-variation-settings:"SOFT" 100,"WONK" 1;font-weight:300;font-size:16px;text-decoration:none;color:var(--lin);white-space:nowrap}

  "f3.texte":"Chez vous, dans le noir, personne ne vous voit — pas même nous, si vous coupez votre caméra. Pour beaucoup de gens, c'est la seule porte d'entrée acceptable, et c'est une raison largement suffisante. Il vous faut un casque, un tapis ou un lit, et deux heures pendant lesquelles personne ne frappera à la porte.",
  "f.demander":"Demander une date",
  "f.mention":"Paiement à la réservation. Annulation sans frais jusqu'à 24 heures avant la séance. Le carnet est nominatif et transmissible une fois.",
  "s4.eyebrow":"Prochaines dates",
  "ag1.quand":"<span class='remplacer'>[jj mois]</span>","ag1.quoi":"Collectif à la Maison · 19 h","ag1.places":"<span class='remplacer'>[n]</span> tapis restants",
  "ag2.quand":"<span class='remplacer'>[jj mois]</span>","ag2.quoi":"Live en ligne · 20 h","ag2.places":"<span class='remplacer'>[n]</span> places restantes",
  "ag3.quand":"<span class='remplacer'>[jj mois]</span>","ag3.quoi":"Collectif à la Maison · 19 h","ag3.places":"<span class='remplacer'>[n]</span> tapis restants",
  "ag.note":"Les places restantes sont mises à jour manuellement après chaque réservation. Nous n'affichons jamais de compte à rebours ni de rareté fabriquée.",
  "mail.label":"Prévenez-moi des prochaines dates","mail.ph":"votre adresse e-mail","mail.bouton":"M'avertir",
  "mail.erreur":"Entrez une adresse e-mail valide.",
  "mail.attente":"Ce formulaire n'est pas encore relié à notre outil d'envoi. En attendant, écrivez-nous à jchastang@energies-massages.com et nous vous ajouterons à la main.",
  "s5.eyebrow":"Ce que ce n'est pas",
  "n1":"Ce n'est pas une psychothérapie. Aucune relation thérapeutique n'est engagée pendant une séance, aucun suivi n'y est proposé, et nous ne posons aucun diagnostic. Une séance ne remplace aucune prise en charge en cours.",
  "n2":"Ce n'est pas une pratique religieuse. Aucune adhésion, aucun maître, aucun engagement au-delà de la séance que vous réservez.",
  "n3":"Ce n'est pas un spectacle. Aucun contact physique n'est initié sans votre accord explicite, et vous pouvez quitter la salle à tout moment.",
  "n4":"Ce n'est pas garanti. Certaines personnes ne ressentent presque rien à la première séance. Nous préférons vous le dire avant que vous ne payiez.",
  "s6.eyebrow":"Précautions",
  "prec.intro":"L'innerdance peut provoquer des libérations émotionnelles fortes et des mouvements involontaires. Dans certaines situations, nous refuserons votre inscription ou nous vous demanderons un avis médical écrit. Ce n'est pas une précaution de façade : c'est la condition pour que la salle reste un endroit sûr.",
  "prec.l1":"Épilepsie, en particulier photosensible.",
  "prec.l2":"Antécédents psychotiques, épisode dissociatif, trouble bipolaire non stabilisé.",
  "prec.l3":"Traitement psychotrope introduit ou modifié depuis moins de trois mois.",
  "prec.l4":"Deuil, agression ou traumatisme survenu dans les dernières semaines.",
  "prec.l5":"Grossesse : avis de votre médecin ou de votre sage-femme requis.",
  "prec.l6":"Troubles cardiaques ou respiratoires : la phase de respiration guidée est soutenue.",
  "prec.l7":"Alcool ou substances le jour de la séance : accès refusé, sans remboursement.",
  "prec.l8":"Moins de 18 ans : nous n'accueillons pas de mineurs, même accompagnés.",
  "prec.fin":"Cette liste ne remplace pas un avis médical. Si vous suivez un traitement psychiatrique, parlez-en à votre praticien avant de réserver. Nous préférons que vous veniez plus tard et dans de bonnes conditions.",
  "s7.eyebrow":"Questions fréquentes",
  "q1":"Faut-il savoir danser ou bouger ?","r1":"Non. La grande majorité des participants ne bouge presque pas. Le nom décrit ce qui se passe à l'intérieur, pas ce qu'on voit de l'extérieur.",
  "q2":"Et si je pleure devant tout le monde ?","r2":"La lumière est presque éteinte et personne ne regarde personne. Dans une salle de vingt personnes, il y a presque toujours quelqu'un qui pleure — et c'est précisément ce qui autorise les autres à lâcher.",
  "q3":"Et si je ne ressens rien ?","r3":"Cela arrive, surtout la première fois. Ce n'est ni un échec ni un signe que ce n'est pas pour vous. La deuxième séance est souvent très différente de la première.",
  "q4":"Que faut-il apporter ?","r4":"Rien. Tapis, couverture et coussins sont fournis. Prévoyez une tenue confortable et des chaussettes chaudes : la température du corps baisse pendant la trame.",
  "q5":"Puis-je repartir en voiture juste après ?","r5":"Nous le déconseillons dans la demi-heure qui suit. On sort de deux heures d'état modifié et la vigilance met du temps à revenir. Prévoyez du temps, ou les transports.",
  "s8.eyebrow":"Venir",
  "s9.eyebrow":"La transmission",
  "tr.lead":"On ne confie pas son système nerveux à quelqu'un sur la foi d'un site. Voici donc des dates et des noms, plutôt que des adjectifs.",
  "tr.g1":"L'ancrage du corps — Jérôme",
  "tr.a1.q":"Septembre 2015 — Genève","tr.a1.f":"Diplôme de <b>massage classique suédois</b>, HP Formation.",
  "tr.a2.q":"Depuis 2016","tr.a2.f":"Pratique de massothérapie sans interruption. <b>Dix ans de mains sur des corps</b> — la seule façon d'apprendre l'anatomie autrement que dans un livre.",
  "tr.a3.q":"Formations spécifiques","tr.a3.f":"Massage prénatal et soins en entreprise.",
  "tr.g2":"La lignée de la source — Jérôme et Olga",
  "tr.b1.q":"Décembre 2024 — Paris","tr.b1.f":"Formation initiale à l'<b>activation kundalini</b>, cinq jours auprès de Céline Bergamini.",
  "tr.b2.q":"Depuis janvier 2025","tr.b2.f":"Facilitation en exercice, tous les deux.",
  "tr.b3.q":"Août 2025 — Prague","tr.b3.f":"Quatre jours auprès de <b>Pi Villaraza</b>, qui a formalisé l'innerdance.",
  "tr.b4.q":"Septembre 2025 — Bornem","tr.b4.f":"Quatre jours auprès de Pi Villaraza, en Belgique.",
  "tr.b5.q":"Tout au long de 2025","tr.b5.f":"Transmissions régulières auprès de <b>Sofie Blyau</b>.",
  "tr.b6.q":"Février 2026 — Palawan","tr.b6.f":"Une semaine d'immersion chez Pi Villaraza, dans son écovillage de <b>Maya Village</b>, aux Philippines. Six heures du matin à vingt-deux heures, vingt participants venus du monde entier.",
  "img1.alt":"Pi Villaraza dans son écovillage de Maya Village, à Palawan.",
  "img1.cap":"Pi Villaraza. Maya Village, Palawan — février 2026.",
  "img2.alt":"Pi Villaraza avec Jérôme et Olga, à la fin de la semaine d'immersion à Maya Village.",
  "img2.cap":"Pi Villaraza, Jérôme et Olga. Dernier jour de l'immersion, Maya Village — février 2026.",
  "tr.b7.q":"Depuis 2026","tr.b7.f":"Facilitation des séances collectives <b>à deux</b>, au studio.",
  "tr.binome":"<b>Pourquoi deux facilitateurs.</b> Ce n'est pas une question d'équilibre symbolique. À vingt tapis, une personne seule doit choisir : rester auprès de quelqu'un qui traverse quelque chose, ou continuer à tenir la salle et la trame sonore. À deux, ce choix n'existe plus. L'un peut s'asseoir près de vous aussi longtemps qu'il le faut pendant que l'autre porte le groupe. C'est la seule raison pour laquelle nous facilitons en binôme, et elle suffit.",
  "tr.fin":"Ce que cela change pour vous. Quelqu'un qui a passé dix ans à sentir sous ses doigts ce qu'un corps retient sait reconnaître, dans une salle plongée dans le noir, la différence entre une décharge qui se dénoue et une personne auprès de qui il faut venir s'asseoir. C'est la seule raison pour laquelle ces dates figurent sur cette page.",
  "acces.adresse":"<b>Adresse</b> — Route de Florissant 70, 1206 Genève",
  "acces.tpg":"<b>TPG</b> — arrêt Krieg, lignes 8 et 21, juste devant la Maison.",
  "acces.parking":"<b>En voiture</b> — parking de Florissant, à moins de 2 minutes à pied.",
  "cloture.note":"Première fois ? Écrivez-nous, nous choisirons ensemble par où commencer."
 },
 en:{
  "html.title":"Innerdance & kundalini activation in Geneva — Maison Inner Source",
  "a11y.lang":"Language",
  "nav.innerdance":"Innerdance","nav.body":"Body treatments","nav.agenda":"Schedule",
  "ui.sound":"Sound","ui.soundOn":"Sound on","ui.calme":"Calm the background","ui.calmeOn":"Background calmed","pied.droits":"© Maison Inner Source","pied.legal":"Legal notice","pied.confid":"Privacy","ui.ville":"Geneva",
  "ui.ch1":"Innerdance","ui.ch2":"The session","ui.ch3":"The formats","ui.ch4":"Schedule","ui.ch5":"Precautions","ui.ch6":"Getting here","ui.ch7":"The transmission",
  "fil.accueil":"Home","fil.pratiques":"Practices","fil.ici":"Innerdance",
  "p.surtitre":"The vibratory journey","p.h1":"Innerdance",
  "p.alias":"also known as kundalini activation",
  "p.promesse":"Two hours, lying down, eyes closed, inside a sound score built for exactly this. You have nothing to do and nothing to work out. The nervous system drops a level, and what was held starts moving on its own.",
  "p.cta":"Book a mat","p.meta":"2 h · CHF 40 to CHF 200",
  "s1.eyebrow":"What actually happens",
  "s1.texte":"You stay lying down. Nobody asks you to dance, to speak, or to believe in anything. The music does the work: a score of low frequencies and silences that occupies attention until it lets go.",
  "s1.sous":"From there, reactions vary enormously. Some people move, shake or cry. Others stay perfectly still for two hours and leave feeling they slept very deeply. Neither experience is better than the other, and we cannot promise you which will be yours.",
  "s2.eyebrow":"The session, minute by minute",
  "d1.min":"0 – 15 min","d1.txt":"<b>Setting down.</b> You arrive, you settle in, you say in one word what you have come to set down. Nobody has to speak. We go through the medical precautions out loud, at every session.",
  "d2.min":"15 – 30 min","d2.txt":"<b>Settling in.</b> Lights almost off, mat, blanket. A guided breathing sequence for about fifteen minutes: the only moment of the session when anything is asked of you. No physical contact is ever initiated without your explicit consent.",
  "d3.min":"30 – 95 min","d3.txt":"<b>The score.</b> Sixty-five minutes of music. Nothing more is asked, nothing more is expected. This is where what is called a trance settles in: a state between sleep and waking in which the body can start moving without a conscious decision.",
  "d4.min":"95 – 110 min","d4.txt":"<b>Coming back.</b> The music slowly comes down. You are left to surface at your own pace, with no abrupt waking. Water, silence, no instructions.",
  "d5.min":"110 – 120 min","d5.txt":"<b>The threshold.</b> You sit back up. Sharing is possible, never required. Many leave without a word, and that is entirely fine.",
  "s3.eyebrow":"The three formats",
  "f1.nom":"The group session","f1.cadre":"At the studio · 20 mats · 2 h","f1.prix":"CHF 80",
  "f1.texte":"This is the original format and the one we prefer. Twenty bodies in the same room produce something no pair of headphones reproduces: someone lets go at the other end of the room, and your own chest loosens without you deciding anything. The lights are almost off: you will see no one, and no one will see you. These sessions are facilitated by two.",
  "f1.carnet":"<b>Book of five sessions — CHF 340</b> instead of 400. Valid one year, transferable once.",
  "f2.nom":"The private session","f2.cadre":"At the studio · private session · 2 h","f2.prix":"CHF 200",
  "f2.texte":"The sound score is built for you and adjusted live according to what your breathing does. Someone watches only you for two hours. This is the format if you are going through something specific, or if the idea of a group is what stops you coming at all.",
  "f3.nom":"The live session","f3.cadre":"Online · 30 to 40 participants · 2 h","f3.prix":"CHF 40",
  "f3.texte":"At home, in the dark, nobody sees you — not even us, if you turn your camera off. For many people this is the only acceptable way in, and that is reason enough. You need headphones, a mat or a bed, and two hours during which nobody will knock at the door.",
  "f.demander":"Request a date",
  "f.mention":"Payment on booking. Free cancellation up to 24 hours before the session. The book of five is personal and transferable once.",
  "s4.eyebrow":"Next dates",
  "ag1.quand":"<span class='remplacer'>[dd month]</span>","ag1.quoi":"Group at the Maison · 7 pm","ag1.places":"<span class='remplacer'>[n]</span> mats left",
  "ag2.quand":"<span class='remplacer'>[dd month]</span>","ag2.quoi":"Live online · 8 pm","ag2.places":"<span class='remplacer'>[n]</span> places left",
  "ag3.quand":"<span class='remplacer'>[dd month]</span>","ag3.quoi":"Group at the Maison · 7 pm","ag3.places":"<span class='remplacer'>[n]</span> mats left",
  "ag.note":"Remaining places are updated by hand after each booking. We never display a countdown or manufactured scarcity.",
  "mail.label":"Tell me about the next dates","mail.ph":"your email address","mail.bouton":"Notify me",
  "mail.erreur":"Enter a valid email address.",
  "mail.attente":"This form is not yet connected to our mailing tool. In the meantime, write to us at jchastang@energies-massages.com and we will add you by hand.",
  "s5.eyebrow":"What this is not",
  "n1":"This is not psychotherapy. No therapeutic relationship is engaged during a session, no follow-up is offered, and we make no diagnosis. A session replaces no ongoing care.",
  "n2":"This is not a religious practice. No membership, no master, no commitment beyond the session you book.",
  "n3":"This is not a performance. No physical contact is initiated without your explicit consent, and you may leave the room at any time.",
  "n4":"This is not guaranteed. Some people feel almost nothing at their first session. We would rather tell you before you pay.",
  "s6.eyebrow":"Precautions",
  "prec.intro":"Innerdance can bring on strong emotional release and involuntary movement. In some situations we will decline your registration or ask for written medical clearance. This is not a token precaution: it is what keeps the room a safe place.",
  "prec.l1":"Epilepsy, in particular photosensitive epilepsy.",
  "prec.l2":"History of psychosis, dissociative episodes, unstabilised bipolar disorder.",
  "prec.l3":"Psychotropic treatment started or changed less than three months ago.",
  "prec.l4":"Bereavement, assault or trauma within the last few weeks.",
  "prec.l5":"Pregnancy: clearance from your doctor or midwife required.",
  "prec.l6":"Cardiac or respiratory conditions: the guided breathing phase is sustained.",
  "prec.l7":"Alcohol or substances on the day of the session: entry refused, without refund.",
  "prec.l8":"Under 18: we do not admit minors, even accompanied.",
  "prec.fin":"This list does not replace medical advice. If you are under psychiatric treatment, speak to your practitioner before booking. We would rather you came later and in good conditions.",
  "s7.eyebrow":"Frequent questions",
  "q1":"Do I need to know how to dance or move?","r1":"No. The great majority of participants barely move at all. The name describes what happens inside, not what is seen from outside.",
  "q2":"What if I cry in front of everyone?","r2":"The lights are almost off and nobody is watching anybody. In a room of twenty, there is almost always someone crying — and that is precisely what gives the others permission.",
  "q3":"What if I feel nothing?","r3":"It happens, especially the first time. It is neither a failure nor a sign that this is not for you. The second session is often very different from the first.",
  "q4":"What should I bring?","r4":"Nothing. Mat, blanket and cushions are provided. Bring comfortable clothes and warm socks: body temperature drops during the score.",
  "q5":"Can I drive home straight after?","r5":"We advise against it for the following half hour. You are coming out of two hours of altered state and alertness takes time to return. Allow time, or take public transport.",
  "s8.eyebrow":"Getting here",
  "s9.eyebrow":"The transmission",
  "tr.lead":"You don't hand your nervous system to someone on the strength of a website. So here are dates and names, rather than adjectives.",
  "tr.g1":"Grounding in the body — Jérôme",
  "tr.a1.q":"September 2015 — Geneva","tr.a1.f":"Diploma in <b>classical Swedish massage</b>, HP Formation.",
  "tr.a2.q":"Since 2016","tr.a2.f":"Continuous massage practice. <b>Ten years of hands on bodies</b> — the only way to learn anatomy other than from a book.",
  "tr.a3.q":"Specific training","tr.a3.f":"Prenatal massage and workplace treatments.",
  "tr.g2":"The lineage of the source — Jérôme and Olga",
  "tr.b1.q":"December 2024 — Paris","tr.b1.f":"Initial training in <b>kundalini activation</b>, five days with Céline Bergamini.",
  "tr.b2.q":"Since January 2025","tr.b2.f":"Both facilitating in practice.",
  "tr.b3.q":"August 2025 — Prague","tr.b3.f":"Four days with <b>Pi Villaraza</b>, who formalised innerdance.",
  "tr.b4.q":"September 2025 — Bornem","tr.b4.f":"Four days with Pi Villaraza, in Belgium.",
  "tr.b5.q":"Throughout 2025","tr.b5.f":"Regular transmissions with <b>Sofie Blyau</b>.",
  "tr.b6.q":"February 2026 — Palawan","tr.b6.f":"A week of immersion with Pi Villaraza at his <b>Maya Village</b> ecovillage in the Philippines. Six in the morning to ten at night, twenty participants from around the world.",
  "img1.alt":"Pi Villaraza at his Maya Village ecovillage in Palawan.",
  "img1.cap":"Pi Villaraza. Maya Village, Palawan — February 2026.",
  "img2.alt":"Pi Villaraza with Jérôme and Olga at the end of the immersion week at Maya Village.",
  "img2.cap":"Pi Villaraza, Jérôme and Olga. Last day of the immersion, Maya Village — February 2026.",
  "tr.b7.q":"Since 2026","tr.b7.f":"Group sessions facilitated <b>by two</b>, at the studio.",
  "tr.binome":"<b>Why two facilitators.</b> This is not about symbolic balance. With twenty mats, one person has to choose: stay beside someone going through something, or keep holding the room and the sound score. With two, that choice disappears. One can sit beside you for as long as it takes while the other carries the group. That is the only reason we facilitate as a pair, and it is reason enough.",
  "tr.fin":"What this changes for you. Someone who has spent ten years feeling under their fingers what a body holds can tell, in a room in near darkness, the difference between a release working itself out and a person who needs someone to come and sit beside them. That is the only reason these dates appear on this page.",
  "acces.adresse":"<b>Address</b> — Route de Florissant 70, 1206 Geneva",
  "acces.tpg":"<b>TPG</b> — Krieg stop, lines 8 and 21, directly in front of the Maison.",
  "acces.parking":"<b>By car</b> — Florissant car park, under 2 minutes on foot.",
  "cloture.note":"First time? Write to us and we'll choose where to start together."
 },
 ru:{
  "html.title":"Иннердэнс и активация кундалини в Женеве — Maison Inner Source",
  "a11y.lang":"Выбор языка",
  "nav.innerdance":"Иннердэнс","nav.body":"Уход за телом","nav.agenda":"Расписание",
  "ui.sound":"Звук","ui.soundOn":"Звук включён","ui.calme":"Успокоить фон","ui.calmeOn":"Фон успокоен","pied.droits":"© Maison Inner Source","pied.legal":"Правовая информация","pied.confid":"Конфиденциальность","ui.ville":"Женева",
  "ui.ch1":"Иннердэнс","ui.ch2":"Ход сессии","ui.ch3":"Форматы","ui.ch4":"Расписание","ui.ch5":"Предосторожности","ui.ch6":"Как добраться","ui.ch7":"Преемственность",
  "fil.accueil":"Главная","fil.pratiques":"Практики","fil.ici":"Иннердэнс",
  "p.surtitre":"Вибрационное путешествие","p.h1":"Иннердэнс",
  "p.alias":"также известен как активация кундалини",
  "p.promesse":"Два часа лёжа, с закрытыми глазами, внутри звукового полотна, созданного именно для этого. Вам не нужно ничего делать и ничего понимать. Нервная система опускается на уровень ниже, и то, что удерживалось, начинает двигаться само.",
  "p.cta":"Забронировать место","p.meta":"2 ч · от CHF 40 до CHF 200",
  "s1.eyebrow":"Что происходит на самом деле",
  "s1.texte":"Вы остаётесь лежать. Никто не просит вас танцевать, говорить или во что-то верить. Работает музыка: полотно из низких частот и пауз, которое занимает внимание, пока оно не отпустит.",
  "s1.sous":"Дальше реакции очень разные. Кто-то двигается, дрожит или плачет. Кто-то лежит совершенно неподвижно два часа и уходит с ощущением очень глубокого сна. Ни один из этих опытов не лучше другого, и мы не можем обещать, каким будет ваш.",
  "s2.eyebrow":"Ход сессии, минута за минутой",
  "d1.min":"0 – 15 мин","d1.txt":"<b>Что вы приносите.</b> Вы приходите, устраиваетесь, одним словом называете то, что пришли положить. Говорить необязательно. Мы вслух проходим список предосторожностей — на каждой сессии.",
  "d2.min":"15 – 30 мин","d2.txt":"<b>Подготовка.</b> Свет почти погашен, коврик, плед. Ведомое дыхание около пятнадцати минут — единственный момент, когда от вас что-то требуется. Физический контакт никогда не начинается без вашего явного согласия.",
  "d3.min":"30 – 95 мин","d3.txt":"<b>Полотно.</b> Шестьдесят пять минут музыки. Больше ничего не требуется и ничего не ожидается. Именно здесь устанавливается то, что называют трансом: состояние между сном и бодрствованием, в котором тело может начать двигаться без сознательного решения.",
  "d4.min":"95 – 110 мин","d4.txt":"<b>Возвращение.</b> Музыка медленно уходит. Вам дают подняться в своём темпе, без резкого пробуждения. Вода, тишина, никаких указаний.",
  "d5.min":"110 – 120 мин","d5.txt":"<b>Порог.</b> Вы садитесь. Поделиться можно, но необязательно. Многие уходят молча, и это совершенно нормально.",
  "s3.eyebrow":"Три формата",
  "f1.nom":"Группа","f1.cadre":"В студии · 20 мест · 2 ч","f1.prix":"CHF 80",
  "f1.texte":"Это исходный формат и тот, который мы предпочитаем. Двадцать тел в одной комнате создают то, что не воспроизведут никакие наушники: кто-то отпускает в другом конце зала, и ваша собственная грудная клетка раскрывается без всякого решения с вашей стороны. Свет почти погашен: вы никого не увидите, и вас не увидит никто. Эти сессии проводятся вдвоём.",
  "f1.carnet":"<b>Абонемент на пять сессий — CHF 340</b> вместо 400. Действителен год, передаётся один раз.",
  "f2.nom":"Индивидуально","f2.cadre":"В студии · индивидуальная сессия · 2 ч","f2.prix":"CHF 200",
  "f2.texte":"Звуковое полотно строится под вас и корректируется вживую по тому, что делает ваше дыхание. Два часа кто-то смотрит только на вас. Этот формат подходит, если вы проходите через что-то конкретное или если сама мысль о группе мешает вам прийти.",
  "f3.nom":"Онлайн","f3.cadre":"Онлайн · 30–40 участников · 2 ч","f3.prix":"CHF 40",
  "f3.texte":"У себя дома, в темноте, вас никто не видит — даже мы, если вы выключите камеру. Для многих это единственная приемлемая дверь, и этого достаточно. Нужны наушники, коврик или кровать и два часа, в которые никто не постучит.",
  "f.demander":"Запросить дату",

let langue='fr',cyrilliqueCharge=false,chapitreActif='ui.ch1';
function chargerCyrillique(){
  if(cyrilliqueCharge)return; cyrilliqueCharge=true;
  const l=document.createElement('link'); l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap';
  document.head.appendChild(l);
}
function peindre(l){
  const d=DICO[l];
  qa('[data-i18n]').forEach(el=>{const v=d[el.dataset.i18n]; if(v!==undefined) el.textContent=v;});
  qa('[data-i18n-html]').forEach(el=>{const v=d[el.dataset.i18nHtml]; if(v!==undefined) el.innerHTML=v;});
  qa('[data-i18n-aria]').forEach(el=>{const v=d[el.dataset.i18nAria]; if(v!==undefined) el.setAttribute('aria-label',v);});
  qa('[data-i18n-ph]').forEach(el=>{const v=d[el.dataset.i18nPh]; if(v!==undefined) el.placeholder=v;});
  qa('[data-i18n-alt]').forEach(el=>{const v=d[el.dataset.i18nAlt]; if(v!==undefined) el.alt=v;});
  q('#chapitre').textContent=d[chapitreActif];
  document.title=d['html.title'];
  q('#son-label').textContent=d[q('#son').getAttribute('aria-pressed')==='true'?'ui.soundOn':'ui.sound'];
  q('#calme-label').textContent=d[q('#calme').getAttribute('aria-pressed')==='true'?'ui.calmeOn':'ui.calme'];
}
function placerCurseur(){
  const a=q('.langues button[aria-current="true"]'),c=q('#curseur-langue');
  c.style.width=a.offsetWidth+'px'; c.style.transform=`translateX(${a.offsetLeft}px)`;
}
function definirLangue(l,animer=true){
  if(l===langue&&animer)return;
  if(l==='ru')chargerCyrillique();
  langue=l; document.documentElement.lang=l;
  qa('.langues button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.lang===l)));
  const url=new URL(location); url.searchParams.set('lang',l); history.replaceState({},'',url);
  if(!animer||SOBRE){peindre(l); requestAnimationFrame(placerCurseur); return;}
  document.body.classList.add('change');
  setTimeout(()=>{peindre(l); document.fonts.ready.then(placerCurseur); requestAnimationFrame(()=>document.body.classList.remove('change'));},343);
}
qa('.langues button').forEach(b=>b.addEventListener('click',()=>definirLangue(b.dataset.lang)));
const initiale=new URL(location).searchParams.get('lang');
definirLangue(DICO[initiale]?initiale:'fr',false);
addEventListener('resize',placerCurseur);
document.fonts&&document.fonts.ready.then(placerCurseur);

  if(cle===chapitreActif)return;
  chapitreActif=cle;

  rail.classList.add('permute');

/* ---------- Le champ : mode uTrance ---------- */
const frag=`
precision highp float;
varying vec2 vUv;
uniform vec2 uRes; uniform float uTime; uniform float uFlux;
uniform vec2 uSouris; uniform float uDensite; uniform float uTrance;
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float bruit(vec2 p){
  vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);
}
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){v+=a*bruit(p); p*=2.03; a*=0.5;} return v; }
void main(){
  vec2 uv=vUv; float ratio=uRes.x/uRes.y; vec2 p=vec2(uv.x*ratio,uv.y); float t=uTime;

  float cx  = mix(0.715, 0.545, uTrance);
  float amp = mix(1.0, 1.6, uTrance);

  vec2 qq=p*mix(2.15,1.95,uTrance);
  qq.y -= t*(0.040+uFlux*0.7);
  float w1=fbm(qq+vec2(0.0,t*0.022)), w2=fbm(qq+vec2(4.7,-t*0.018));
  vec2 warp=(vec2(w1,w2)-0.5)*amp;
  float f=fbm(qq+warp*2.1); f=fbm(qq+warp*1.4+vec2(f*0.9));
  f += exp(-distance(p,vec2(uSouris.x,uSouris.y))*3.2)*0.30;

  float bInt=mix(0.055,0.10,uTrance), bExt=mix(0.315,0.44,uTrance);
  float colonne=1.0-smoothstep(bInt,bExt,abs(uv.x-cx));
  float sol=smoothstep(-0.05,0.26,uv.y);
  float ciel=1.0-smoothstep(mix(0.62,0.70,uTrance),mix(1.06,1.12,uTrance),uv.y);
  float masque=colonne*sol*mix(ciel,1.0,0.35);
  float halo=(1.0-smoothstep(0.0,0.66,abs(uv.x-cx)))*mix(0.09,0.15,uTrance)*sol;

  float i=(pow(max(f,0.0),2.35)*masque*2.55+halo*f)*uDensite*mix(1.0,1.22,uTrance);

  /* Éclats phosphène : la lumière derrière les paupières */
  float eclat=pow(max(fbm(qq*3.2+vec2(1.7,-t*0.10)),0.0),4.5);
  eclat=clamp(eclat*3.4,0.0,1.0);
  i += eclat*uTrance*colonne*sol*0.26;

  vec3 indigo=vec3(0.114,0.173,0.275), seve=vec3(0.373,0.620,0.494), phos=vec3(0.827,0.808,0.525);
  float h=clamp(uv.y*0.78+f*0.42-0.06,0.0,1.0);
  vec3 col=mix(indigo,seve,smoothstep(0.06,0.60,h));
  col=mix(col,phos,smoothstep(0.66,1.0,h)*0.78);
  col=mix(col,indigo,uTrance*0.52);
  col=mix(col,phos,eclat*uTrance*0.80);

  float g=(hash(uv*uRes+t)-0.5)*0.030;
  gl_FragColor=vec4(col+g,clamp(i,0.0,1.0));
}`;

const cv=q('#champ');
let renderer,scene,camera,mat,brut=0,flux=0;
const souris=new THREE.Vector2(0.60*(innerWidth/innerHeight),.55),cible=souris.clone();
const etat={trance:0,densite:1.05,opacite:0,calme:1};

try{
  renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:false,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight,false);
  scene=new THREE.Scene();
  camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    vertexShader:'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
    fragmentShader:frag,
    uniforms:{uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},uTime:{value:0},uFlux:{value:0},
      uSouris:{value:souris},uDensite:{value:1.05},uTrance:{value:0}}});
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
}catch(e){cv.style.display='none';}

addEventListener('resize',()=>{
  if(!renderer)return;
  renderer.setSize(innerWidth,innerHeight,false);
  mat.uniforms.uRes.value.set(innerWidth,innerHeight);
});

let visible=true,horloge=0,dernier=performance.now();
document.addEventListener('visibilitychange',()=>{
  visible=!document.hidden; dernier=performance.now();
  if(visible&&!SOBRE)requestAnimationFrame(boucle);
});
function boucle(now){
  if(!renderer)return;
  const dt=Math.min((now-dernier)/1000,.05); dernier=now;
  horloge+=dt*(0.34+0.66*etat.calme);
  brut*=Math.pow(0.0016,dt);
  flux+=(brut-flux)*Math.min(dt*3.4,1);
  souris.lerp(cible,Math.min(dt*2.2,1));
  const u=mat.uniforms;
  u.uTime.value=horloge; u.uFlux.value=flux*etat.calme;
  u.uTrance.value=etat.trance*etat.calme;
  u.uDensite.value=etat.densite;
  cv.style.opacity=etat.opacite*(0.42+0.58*etat.calme);
  renderer.render(scene,camera);
  if(visible)requestAnimationFrame(boucle);
}
if(renderer){
  if(SOBRE){
    etat.trance=0.35; etat.opacite=0.62; horloge=14;
    const u=mat.uniforms; u.uTime.value=horloge; u.uTrance.value=etat.trance;
    cv.style.opacity=etat.opacite; renderer.render(scene,camera);
  }else{
    requestAnimationFrame(boucle);
    gsap.to(etat,{trance:1,opacite:0.82,duration:5.5,ease:'power2.inOut'});
  }
}

/* La transe respire au rythme de la lecture */
const ioTrance=new IntersectionObserver(es=>{
  es.forEach(e=>{ e.target.dataset.ratio=e.intersectionRatio; });
  let meilleur=null,max=0;
  qa('[data-trance]').forEach(el=>{
    const r=parseFloat(el.dataset.ratio||0);
    if(r>max){max=r; meilleur=el;}
  });
  if(meilleur && max>0.05){
    const cible=parseFloat(meilleur.dataset.trance);
    gsap.to(etat,{trance:cible,opacite:0.46+cible*0.36,duration:2.75,ease:'power2.out',overwrite:'auto'});
  }
},{threshold:[0,.15,.3,.5,.7,.9,1],rootMargin:'-22% 0px -22% 0px'});
if(!SOBRE) qa('[data-trance]').forEach(el=>ioTrance.observe(el));

  qa('a,button').forEach(el=>{
    el.addEventListener('pointerenter',()=>{anneau.style.width='46px';anneau.style.height='46px';anneau.style.margin='-23px 0 0 -23px';});
    el.addEventListener('pointerleave',()=>{anneau.style.width='26px';anneau.style.height='26px';anneau.style.margin='-13px 0 0 -13px';});
  });
}

let ctx,master;
q('#son').addEventListener('click',e=>{
  const b=e.currentTarget,actif=b.getAttribute('aria-pressed')==='true';
  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0;
    const filtre=ctx.createBiquadFilter(); filtre.type='lowpass'; filtre.frequency.value=520; filtre.Q.value=.6;
    master.connect(filtre).connect(ctx.destination);
    [55.00,82.41,110.00,164.81].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=i===3?'triangle':'sine'; o.frequency.value=f*(1+(i-1)*0.0015);
      g.gain.value=[.46,.30,.18,.07][i]; o.connect(g).connect(master); o.start();
    });
    const lfo=ctx.createOscillator(),la=ctx.createGain();
    lfo.frequency.value=1/5.5; la.gain.value=.034;
    lfo.connect(la).connect(master.gain); lfo.start();
  }
  if(ctx.state==='suspended')ctx.resume();
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(actif?0:.072,ctx.currentTime,1.4);
  b.setAttribute('aria-pressed',String(!actif));
  q('#son-label').textContent=DICO[langue][actif?'ui.sound':'ui.soundOn'];
});
</script>
